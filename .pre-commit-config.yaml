# Pre-commit hooks — the independent enforcement backstop.
#
# Runs on `git commit`. The architecture + version gates here mirror
# `make validate`, so a commit cannot bypass them even if `make validate` was
# skipped. This is the third enforcement layer, alongside the Makefile gates
# and the Stop hook.
#
#   One-time setup per clone:   pre-commit install     (or: make bootstrap)
#   Refresh pinned versions:    pre-commit autoupdate
#
# The `rev:` pins below are real releases; run `pre-commit autoupdate` to move
# them forward. The repo-native gates under `local` have no pins to go stale.
#
# Deliberately NOT here: swiftlint and xcodebuild. Both need macOS, and a hook
# that silently no-ops on half the machines is worse than no hook — those live
# in `make lint` / `make verify`, which say out loud when they cannot run.

# Generated lockfiles are tool-owned: exempt from secret-scanning, size caps,
# and whitespace rewriting (their hashes false-positive detect-secrets, and
# rewriting them corrupts tool state).
exclude: '(^|/)(uv\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|Cargo\.lock|poetry\.lock|Gemfile\.lock|composer\.lock|Package\.resolved|Podfile\.lock|flake\.lock|go\.sum|gradle\.lockfile)$'

repos:
  # ── Hygiene + private-key detection (pure Python, no toolchain) ──────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  # ── Secret scanning — detect-secrets is pure Python, so pre-commit
  # installs it with no Go/Docker toolchain (unlike gitleaks). The Apple
  # -shaped leaks it does not model (bundled Environment.plist, a .p8 forced
  # past .gitignore) are covered by the local apple-secret-scan hook below.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # ── Shell-script linting — pip-packaged shellcheck, no system dep ───
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # ── Repo-native gates — mirror `make validate`; no remote pins ──────
  - repo: local
    hooks:
      - id: check-architecture
        name: architecture line limits (VIBE.yaml)
        entry: scripts/check_architecture.py
        language: script
        pass_filenames: false
        always_run: true
      - id: check-module-rules
        name: module shape — max public functions (VIBE.yaml)
        entry: scripts/check_module_rules.py
        language: script
        pass_filenames: false
        always_run: true
      - id: check-version-bumped
        name: VERSION bumped + CHANGELOG entry
        entry: scripts/check_version_bumped.py
        language: script
        pass_filenames: false
        always_run: true
      - id: apple-secret-scan
        name: no secrets in plists / xcconfigs / signing material
        entry: scripts/apple/scan-plist-secrets.sh
        language: script
        files: '(\.(plist|xcprivacy|xcconfig|entitlements|p8|p12|cer|mobileprovision|keystore)|Environment\.plist)$'
      # Routed through make on purpose: `make spinner-check` already knows to
      # skip when the generator removed scripts/sync_spinner_verbs.py
      # (ops.spinner_flavor: false), so a pruned repo keeps a working hook.
      - id: spinner-check
        name: .claude/settings.json matches the spinner corpus
        entry: make spinner-check
        language: system
        pass_filenames: false
        files: '^(\.claude/spinner-(verbs|tips)\.txt|\.claude/settings\.json)$'
