# CI combo: ios-widgets-la
#
# iPhone-only with the full glanceable surface: home widgets, a Live
# Activity and the Notification Service Extension that feeds them.
#
# Consumed by template/tests/test_combos.py and by the verify-macos
# matrix. Schema: template/answers.schema.json.

identity:
  app_name: MyApp
  display_name: "MyApp"
  bundle_root: com.example.myapp
  team_id: ABCDE12345

components:
  mac: false
  watch: false
  complications: false
  widgets-home: true
  widget-mac: false
  live-activity: true
  nse: true
  swiftdata: true
  store: false
  account: false
  health: false

deployment:
  ios: "18.0"
  macos: "15.0"
  watchos: "11.0"

ops:
  ci_system: github_actions
  signing: automatic
  frameit: false
  spinner_flavor: true
  statusline: false
  autonomy: continue-until-blocked
  squash_history: false
