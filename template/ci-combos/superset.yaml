# CI combo: superset
#
# Every component on. The committed superset, byte-for-byte: proves the
# generator is a no-op-safe identity transform when nothing is pruned.
#
# Consumed by template/tests/test_combos.py and by the verify-macos
# matrix. Schema: template/answers.schema.json.

identity:
  app_name: MyApp
  display_name: "MyApp"
  bundle_root: com.example.myapp
  team_id: ABCDE12345

components:
  mac: true
  watch: true
  complications: true
  widgets-home: true
  widget-mac: true
  live-activity: true
  nse: true
  swiftdata: true
  store: true
  account: true
  health: true

deployment:
  ios: "18.0"
  macos: "15.0"
  watchos: "11.0"

ops:
  ci_system: xcode_cloud
  signing: automatic
  frameit: false
  spinner_flavor: true
  statusline: true   # superset = every switch ON; statusline.sh must survive verbatim
  autonomy: continue-until-blocked
  squash_history: false
